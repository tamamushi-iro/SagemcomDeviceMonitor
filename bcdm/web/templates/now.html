{% extends "base.html" %}
{% block content %}
<section id="now-root">
  <div class="hero">
    <div class="hero-num"><span id="active-count">–</span></div>
    <div class="hero-label">devices connected to {{ host }}
      <span class="muted">(<span id="total-count">–</span> known)</span>
    </div>
  </div>

  <div class="toolbar">
    <label class="check"><input type="checkbox" id="show-hidden"> show hidden</label>
    <span class="muted" id="now-updated"></span>
  </div>

  <div class="card">
    <table class="grid" id="now-table">
      <thead>
        <tr><th>Name</th><th>IP</th><th>MAC</th><th>Interface</th><th>Active since</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <p class="empty" id="now-empty" hidden>No connected devices yet — waiting for the first poll.</p>
  </div>

  <h2 class="section">Recent activity</h2>
  <div class="card">
    <ul class="events" id="recent-events"><li class="muted">…</li></ul>
  </div>
</section>
{% endblock %}
