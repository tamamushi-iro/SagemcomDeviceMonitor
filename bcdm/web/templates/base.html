<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BellDeviceMonitor{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    // Apply saved/system theme before paint to avoid a flash.
    (function () {
      try {
        var t = localStorage.getItem('bcdm-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body data-poll-interval="{{ poll_interval }}" data-host="{{ host }}">
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">BellDeviceMonitor</div>
      <nav>
        <a href="/" class="{{ 'on' if active == 'overview' else '' }}">Overview</a>
        <a href="/patterns" class="{{ 'on' if active == 'patterns' else '' }}">Patterns</a>
        <a href="/devices" class="{{ 'on' if active == 'devices' else '' }}">Devices</a>
        <a href="/health" class="{{ 'on' if active == 'health' else '' }}">Health</a>
      </nav>
      <div class="side-foot">
        <div class="status">
          <span class="dot" id="status-dot"></span>
          <span id="status-text">connecting…</span>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button">
          <span id="theme-label">Dark mode</span>
        </button>
      </div>
    </aside>
    <main>
      <div class="notice bad" id="status-notice" role="alert" hidden></div>
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
